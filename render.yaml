services:
  - type: web
    name: committee-couture-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK
        value: "0"
      - key: LIVE
        value: "0"
      - key: BASE_PHOTO
        value: base.jpg
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-lite-image
      - key: GOOGLE_API_KEY
        sync: false
